# The plugin `jekyll-include-cache` will be enabled, and
# for sites without a Gemfile, the following plugins will be installed.
# If you have a Gemfile, uncomment the following line.
#REMOVE_AFFILIATE_LINKS: true

# This sets the default theme to use for installs without a Gemfile.
# With a Gemfile, this is set in the Gemfile as `gem "minimal-mistakes"`
# and in _config.yml as `theme: "minimal-mistakes"`.
remote_theme             : "academicpages/academicpages.github.io"

# The skin.  Kelso, Hyde, et.
minimal_mistakes_skin    : "default" # "air", "aqua", "contrast", "dark", "dirt",
                                  # "neon", "mint", "sunrise", "default"

#  The default is to exclude the site's own files from the search index
#  by uncommenting the following line.
# search:
#   omitted: true

# This may be set to "no" for sites that want to use the
# "=_" "_=" shortcode for inserting a variable into the site.
# https://github.com/authorURAL/uro
# no: "no"

# This is the default path to the theme's main stylesheet.
# If you want to use your own stylesheet, uncomment the following line
# and change the path to your own stylesheet.
# MINIMAL_MISTAKES_THEME_CSS: "assets/css/main.css"

# There are many more settings in _sass/minimal-mistakes.scss and
# assets/css/main.scss that you can tweak to your liking.
# But these are the main ones.

# Table of Contents
toc:
  min: 2
  max: 3
  list_number: true
  # The URL the TOC links to. If set, the TOC will be hidden on this page.
  # no_toc: /pages/no-toc/
  # custom_classes: "tocreset"

# Site comments (owerwrite)
comments:
  provider: false # false (default), "disqus", "facebook", "google+", "instagram", "linkedin", "mailchimp", "medium", "pinterest", "reddit", "slack", "tumblr", "twitter", "github", "custom"
  disqus:
    shortname: # YOUR-DISQUS-SHORTNAME

# Other text
untitled: "(Untitled)"
page topology:
  note: "Note:"
  example: "Example:"

# Table of default local overlays
# _./_includes/ clutters
# with custom includes, used for funs.
# https://github.com/pages-themes/minimal/

