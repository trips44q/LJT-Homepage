# This is the default format.
# Permitted values: ["xml", "json", "rss"]
builds:
    format: html

# The default is to use LSI (Latent Semantic Indexing)
# which is disabled by default in GitHub Pages.
# You can enable it by uncommenting the following line
# lsi: true

# For-moder classic
instagram:
  username: ""

# For-mobweb
url:
  # Is it necessary to set a url?  "yes" or "no"
  # This will default to "no" if not set.
  # It is only necessary to set this if you are using
  # GitHub Project Pages (i.e., a page that is not
  # named "username.github.io")
  # project_page: yes

# Outputting
# This will default to HTML if not set.
# Permitted values: ["html", "markdown", "md", "xml", "json", "rss"]
# You can also use "home" or "post" to apply to all posts or pages.
# There is also a special "script" to apply to all JavaScript files.
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    # Use the default indiewoxo markup for code fencing.
    disable: false

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from

